version: '3.8'
services:
  kafka:
    image: apache/kafka:latest
    container_name: surge-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: ic3-surge-lab-1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports: ["9092:9092","29092:29092"]
    volumes: [kafka-data:/var/lib/kafka/data]
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: surge-kafka-ui
    depends_on: [kafka]
    ports: ["8085:8080"]
    environment: {KAFKA_CLUSTERS_0_NAME: local, KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092}
  postgres:
    image: postgres:15
    container_name: surge-postgres
    environment: {POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"], interval: 5s, timeout: 5s, retries: 20}
  airflow:
    image: apache/airflow:2.8.1
    container_name: surge-airflow
    depends_on: {postgres: {condition: service_healthy}}
    environment: [AIRFLOW__CORE__EXECUTOR=LocalExecutor, AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow, AIRFLOW__CORE__LOAD_EXAMPLES=False, AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth, _AIRFLOW_DB_MIGRATE=true, _AIRFLOW_WWW_USER_CREATE=true, _AIRFLOW_WWW_USER_USERNAME=admin, _AIRFLOW_WWW_USER_PASSWORD=admin]
    volumes: [./airflow/dags:/opt/airflow/dags]
    ports: ["8080:8080"]
    command: webserver
  airflow-scheduler:
    image: apache/airflow:2.8.1
    container_name: surge-airflow-scheduler
    depends_on: {postgres: {condition: service_healthy}}
    environment: [AIRFLOW__CORE__EXECUTOR=LocalExecutor, AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow, AIRFLOW__CORE__LOAD_EXAMPLES=False]
    volumes: [./airflow/dags:/opt/airflow/dags]
    command: scheduler
  api:
    build: ./src/SurgeLab.Api
    container_name: surge-api
    ports: ["5000:8080"]
    environment: [Kafka__BootstrapServers=kafka:29092]
    depends_on: [kafka]
  blazor:
    build: ./src/SurgeLab.Blazor
    container_name: surge-blazor
    ports: ["5001:8080"]
    depends_on: [api]
volumes: 
  kafka-data:
  postgres-data:
